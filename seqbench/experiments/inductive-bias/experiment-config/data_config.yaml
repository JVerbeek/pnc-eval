properties:
  amplitude:
    dist: uniform
    dist_params:
    - 1
    - 20
    change: False

  frequency:
    dist: uniform
    dist_params:
    - 1
    - 20
    change: True

  variance:
    dist: uniform
    dist_params:
    - 0.3
    - 0.8
    change: False

  mean:
    dist: uniform
    dist_params:
    - 5
    - 8
    change: False

# Properties of the changepoint
changepoint:
  stepped: True
  location: 250
  order: 1

# Data config 
data_config:
  type: "sawtooth"
  n_datapoints: 500
  n_datasets: 10
  time_range:
  - 0
  - 1
  random_seed: 42
